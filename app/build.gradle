plugins {
    id 'com.android.application'
}

// 默认按课程要求取 33（Android 13）。
// 要让 Android 13 以下的旧手机 / 旧模拟器也能安装演示，可临时构建兼容包：
//     gradlew assembleDebug -PminSdkOverride=24
// 只影响这一次构建产物，不改变仓库里的默认值。
def sdkMin = (project.findProperty('minSdkOverride') ?: '33').toString().toInteger()

android {
    namespace 'edu.hitsz.aircraftwar'
    compileSdk 35

    defaultConfig {
        applicationId "edu.hitsz.aircraftwar"
        // 课程要求：支持的最小 API 级别在 33~35 之间，取 33（Android 13）
        minSdk sdkMin
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 网络对战：WebSocket 长连接 + JSON 编解码
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // 纯逻辑层单元测试（core/ 不含 Android API，可直接在 JVM 上跑）
    testImplementation 'junit:junit:4.13.2'
}
